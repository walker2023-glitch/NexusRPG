name: Compose configuration

on:
  push:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/compose-config.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/compose-config.yml"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare example environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet
