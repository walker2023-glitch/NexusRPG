services:
  # ── Model bootstrap (run once with: make setup) ───────────────────────────
  nexus-llm-init:
    image: ollama/ollama:latest
    container_name: nexus-llm-init
    profiles:
      - setup
    environment:
      - OLLAMA_HOST=http://nexus-llm:11434
    entrypoint: >
      sh -c "
        echo '=== Nexus LLM Init: waiting for Ollama to be ready ===' &&
        until ollama list >/dev/null 2>&1; do sleep 2; done &&
        echo '=== Pulling mistral:7b ===' &&
        ollama pull mistral:7b &&
        echo '=== Pulling nomic-embed-text ===' &&
        ollama pull nomic-embed-text &&
        echo '=== Pulling llava:7b ===' &&
        ollama pull llava:7b &&
        echo '=== All models ready. ===' "
    depends_on:
      nexus-llm:
        condition: service_healthy
    networks:
      - nexus_bridge

  # ── Ollama inference server ───────────────────────────────────────────────
  nexus-llm:
    image: ollama/ollama:latest
    container_name: nexus-llm
    # Ollama is internal-only; the API reaches it over nexus_bridge.
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - nexus-ollama-models:/root/.ollama
    networks:
      - nexus_bridge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── FastAPI backend ───────────────────────────────────────────────────────
  nexus-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://nexus-llm:11434
      - WORLD_STATE_PATH=/data/world_state.json
      - LANCEDB_PATH=/data/lancedb
      - CHRONOS_PATH=/data/chronos
      - AXIOM_RULES_PATH=/data/axiom_rules.json
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - nexus-ollama-models:/root/.ollama
      - nexus-lancedb:/data/lancedb
      - nexus-chronos:/data/chronos
      - ./data:/data
    depends_on:
      nexus-llm:
        condition: service_healthy
    networks:
      - nexus_bridge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Next.js frontend ──────────────────────────────────────────────────────
  nexus-frontend:
    # Built and scanned by GitHub Actions; vault only pulls the runtime image.
    image: ghcr.io/walker2023-glitch/nexusrpg-frontend:main
    container_name: nexus-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      nexus-api:
        condition: service_healthy
    networks:
      - nexus_bridge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\u0027http://localhost:3000/\u0027).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  nexus-ollama-models:
    driver: local
  nexus-lancedb:
    driver: local
  nexus-chronos:
    driver: local

networks:
  nexus_bridge:
    driver: bridge
